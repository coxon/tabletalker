version: "3.9"

services:
  backend:
    build: ./backend-skeleton
    container_name: tt-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LLM_PROVIDER=${LLM_PROVIDER:-qwen}
      - QWEN_API_KEY=${QWEN_API_KEY}
      - QWEN_BASE_URL=${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - QWEN_MODEL=${QWEN_MODEL:-qwen3.6-plus}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - LLM_SMALL_MODEL=${LLM_SMALL_MODEL:-qwen-turbo}
      - MOCK_MODE=${MOCK_MODE:-false}
      - DATA_DIR=/app/data
      - SCHEMAS_FILE=/app/schemas.json
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=http://localhost,http://localhost:8080,http://frontend
    volumes:
      - ./backend-skeleton:/app
      - ./data:/app/data
      - ./eval_results:/app/eval_results
      - ./reports:/app/reports
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    image: nginx:1.27-alpine
    container_name: tt-frontend
    ports:
      - "8080:80"
    volumes:
      - ./design-source:/usr/share/nginx/html:ro
      - ./frontend-patch/api.js:/usr/share/nginx/html/api.js:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tt-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
