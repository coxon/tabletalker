# GitAI / GitLab CI/CD 配置
# 触发：push 到 main 或 PR 创建/更新
# 阶段：lint → test → build → deploy（手动）

stages:
  - lint
  - test
  - build
  - deploy

variables:
  PYTHON_VERSION: "3.12"
  PIP_INDEX_URL: "https://mirrors.aliyun.com/pypi/simple/"
  PIP_TRUSTED_HOST: "mirrors.aliyun.com pypi.org files.pythonhosted.org"
  DOCKER_IMAGE: "registry.aigw.asiainfo.com/hackathon/table-talker"

# 缓存 pip & venv，加速后续 job
cache:
  key: ${CI_COMMIT_REF_SLUG}-py${PYTHON_VERSION}
  paths:
    - .venv/
    - .pip-cache/

# ============ 1. 代码风格检查 ============

lint:python:
  stage: lint
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - pip install --cache-dir=.pip-cache ruff
  script:
    - cd backend-skeleton
    - ruff check . --output-format=gitlab > ../ruff-report.json || true
    - ruff format --check .
  artifacts:
    when: always
    paths: [ruff-report.json]
    expire_in: 1 week
  allow_failure: true   # 不阻塞 PR，只警告

lint:json:
  stage: lint
  image: python:${PYTHON_VERSION}-slim
  script:
    - python -c "import json; [json.load(open(f)) for f in __import__('glob').glob('**/*.json', recursive=True) if 'node_modules' not in f and '.venv' not in f]"

# ============ 2. 单元 + 集成测试 ============

test:backend:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - cd backend-skeleton
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install --cache-dir=../.pip-cache --upgrade pip
    - pip install --cache-dir=../.pip-cache -r requirements.txt
  script:
    - source .venv/bin/activate
    - pytest tests/ -v --tb=short --junit-xml=../pytest-report.xml
  artifacts:
    when: always
    reports:
      junit: pytest-report.xml
    expire_in: 1 week

test:llm-connectivity:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual   # 手动触发，避免每次跑都消耗 token
  before_script:
    - cd backend-skeleton
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install --cache-dir=../.pip-cache -r requirements.txt
  script:
    - source .venv/bin/activate
    - python tools/test_llm.py
  allow_failure: true

# ============ 3. 构建 Docker 镜像 ============

build:backend-image:
  stage: build
  image: docker:24-cli
  services: [docker:24-dind]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - cd backend-skeleton
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t ${DOCKER_IMAGE}:${CI_COMMIT_SHORT_SHA} -t ${DOCKER_IMAGE}:latest .
    - docker push ${DOCKER_IMAGE}:${CI_COMMIT_SHORT_SHA}
    - docker push ${DOCKER_IMAGE}:latest
  needs: ["test:backend"]

build:frontend-tar:
  stage: build
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - apk add --no-cache tar
    - tar czf frontend-${CI_COMMIT_SHORT_SHA}.tar.gz -C design-source .
  artifacts:
    paths: [frontend-*.tar.gz]
    expire_in: 1 month

# ============ 4. 部署（手动触发）============

deploy:staging:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  environment:
    name: staging
    url: http://10.19.79.10:8080
  script:
    - echo "→ 部署到 staging（亚信云内网）"
    - echo "→ docker pull ${DOCKER_IMAGE}:${CI_COMMIT_SHORT_SHA}"
    - echo "→ docker compose up -d backend"
    - echo "✅ Done. URL: http://10.19.79.10:8080"
  needs: ["build:backend-image"]

deploy:demo-day:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: manual
  environment:
    name: demo
    url: http://10.19.79.20:8080
  script:
    - echo "→ 决赛日部署"
    - echo "→ 提交 tag: $CI_COMMIT_TAG"
  needs: ["build:backend-image"]
