[project]
name = "tabletalker-backend"
version = "0.0.1"
description = "TableTalker FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "python-multipart>=0.0.20",
  "jinja2>=3.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "pyright>=1.1.380",
  "pandas-stubs>=2.2",
  # eval/run.py loads cases.yaml; eval/build_datasets.py uses numpy.
  "pyyaml>=6.0",
  "numpy>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
# RUF001/RUF003: we intentionally use Unicode in user-facing trace strings
# and comments (×, ⋈, →) — they read better than ASCII for the report UI.
ignore = ["RUF001", "RUF003"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
