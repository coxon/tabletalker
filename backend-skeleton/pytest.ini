[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

asyncio_mode = auto

# 输出更友好
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

markers =
    slow: 慢测试（>5s）
    integration: 集成测试（依赖外部服务）

# 忽略警告噪音
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
