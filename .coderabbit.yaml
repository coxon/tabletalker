language: zh-CN
early_access: false
tone_instructions: |
  Be concise. Only flag real bugs, security issues, or logic errors.
  Skip style nitpicks, naming preferences, and minor suggestions.
  Do not request tests for hackathon-pace code unless it touches security.

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: false
  poem: false
  review_status: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!演示视频/**"
    - "!自测报告/**"
    - "!架构文档/**"
    - "!eval/**"
    - "!knowledge-base/**"
    - "!**/*.lock"
    - "!**/*.lockb"
    - "!**/dist/**"
    - "!**/.next/**"
    - "!**/node_modules/**"
    - "!**/*.min.js"

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings:
    scope: local
