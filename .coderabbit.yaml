language: en-US
early_access: false
tone_instructions: |
  Be direct and concrete. Cite file path and line. Skip pleasantries.

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!演示视频/**"
    - "!自测报告/eval_artifacts/**"
    - "!**/*.lock"
    - "!**/*.lockb"
    - "!**/dist/**"
    - "!**/.next/**"
    - "!**/node_modules/**"
  labeling_instructions:
    - label: "needs-tests"
      instructions: Apply when the PR adds runtime code without matching tests.

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings:
    scope: local
